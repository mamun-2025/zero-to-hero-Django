


{% extends "hospital/base.html" %}

{% block content %}

<h2>Are you sure you want to delete 
   {{ patient.name }}?
</h2>

<form method="POST">

   {% csrf_token %}

   <button type="submit">
      Yes, Delete
   </button>

</form>

<p>
   <a href="{% url 'hospital:patient_list' %}">
      Cancel
   </a>
</p>


{% endblock %}
