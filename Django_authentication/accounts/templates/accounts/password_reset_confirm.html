


{% extends "accounts/base.html" %}

{% block title %}
Set New Password
{% endblock %}

{% block content %}
<h2>Set New Password</h2>


{% if validlink %}
   <form method="post">

      {% csrf_token %}

      {{ form.as_p }}

      <button type="submit">
         Change Password
      </button>

   </form>
{% else %}
<p>This password reset link is invalid or has already been used.</p>
{% endif %}

{% endblock %}
