

{% extends "accounts/base.html" %}

{% block content %}

<h1>Dashboard</h1>

   {% if request.user.is_authenticated %}

      <p>Welcome {{ request.user.username }}</p>

      <a href="{% url 'accounts:logout' %}">
         Logout
      </a>

   {% else %}

      <a href="{% url 'accounts:login' %}">
         Login
      </a>

      <a href="{% url 'accounts:register' %}">
         Register
      </a>

   {% endif %}

{% endblock %}
