

{% extends "accounts/base.html" %}

{% block content %}

<h1>Login</h1>

<form method="POSt">

   {% csrf_token %}

   {{ form.as_p }}

   <p>
      <label>
         <input type="checkbox"
                name="remember_me">
            Remember Me 
         </input>
      </label>
   </p>

   <button type="submit">
      Login
   </button>

</form>

<p>Don't have an account?
   <a href="{% url 'accounts:register' %}">
      Register
   </a>
</p>

{% endblock %}
