

{% extends "blog/base.html" %}

{% block title %}
Blog List 
{% endblock %}


{% block content %}

   <h2>All Blogs</h2>

   {% for blog in blogs %}

   <h3>
      <a href="{% url 'blog:blog_detail' blog.pk %}">
      {{ blog.title|title }}
      </a>
   </h3>

   <p>{{ blog.content|truncatechars:60 }}</p>

   <p>
      Published:
      {{ blog.created_at|date:"d M Y" }}
   </p>

   <hr>

   {% empty %}

   <p>No blogs avaiable.</p>

   {% endfor %}

{% endblock %}
