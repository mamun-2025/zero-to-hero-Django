

{% extends "blog/base.html" %}

{% block title %}
Blog List 
{% endblock %}


{% block content %}

   <h2>All Blogs</h2>

   {% for blog in blogs %}

   <h3>
      <a href="{% url 'blog:blog_detail' blog.pk %}">
      {{ blog.title }}
      </a>
   </h3>

   {% comment %} <p>{{ blog.content }}</p> {% endcomment %}

   <hr>

   {% empty %}

   <p>No blogs avaiable.</p>

   {% endfor %}

{% endblock %}
